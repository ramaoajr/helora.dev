<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Diagrama: planilhas e mensagens dispersas sendo transformadas em um sistema conectado">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102F4F"/>
      <stop offset="58%" stop-color="#143A60"/>
      <stop offset="100%" stop-color="#0E2843"/>
    </linearGradient>
    <linearGradient id="amberFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4B400" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F4B400" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#F4B400" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="72%" r="46%">
      <stop offset="0%" stop-color="#F4B400" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#F4B400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" rx="28" fill="url(#panel)"/>
  <rect width="800" height="800" rx="28" fill="url(#glow)"/>

  <!-- ============ ZONA SUPERIOR — dispersão ============ -->
  <g opacity=".92">
    <!-- planilha inclinada -->
    <g transform="translate(96 92) rotate(-9)">
      <rect width="176" height="128" rx="10" fill="#0D2740" stroke="#28517A" stroke-width="2"/>
      <rect x="0" y="0" width="176" height="26" rx="10" fill="#1B4266"/>
      <rect x="0" y="16" width="176" height="10" fill="#1B4266"/>
      <g stroke="#33608C" stroke-width="2">
        <path d="M0 52h176M0 78h176M0 104h176M59 26v102M118 26v102"/>
      </g>
      <rect x="10" y="60" width="36" height="8" rx="4" fill="#456F99"/>
      <rect x="69" y="86" width="36" height="8" rx="4" fill="#456F99"/>
    </g>

    <!-- balão de mensagem -->
    <g transform="translate(430 68) rotate(7)">
      <path d="M12 0h164a12 12 0 0 1 12 12v78a12 12 0 0 1-12 12H74l-30 28V102H12A12 12 0 0 1 0 90V12A12 12 0 0 1 12 0z" fill="#0D2740" stroke="#28517A" stroke-width="2"/>
      <g fill="#456F99">
        <rect x="22" y="28" width="120" height="9" rx="4.5"/>
        <rect x="22" y="49" width="146" height="9" rx="4.5"/>
        <rect x="22" y="70" width="86" height="9" rx="4.5"/>
      </g>
    </g>

    <!-- documento solto -->
    <g transform="translate(150 250) rotate(6)">
      <rect width="132" height="104" rx="9" fill="#0D2740" stroke="#28517A" stroke-width="2"/>
      <g fill="#456F99">
        <rect x="16" y="22" width="80" height="8" rx="4"/>
        <rect x="16" y="44" width="100" height="8" rx="4"/>
        <rect x="16" y="66" width="62" height="8" rx="4"/>
      </g>
    </g>

    <!-- alerta -->
    <g transform="translate(470 236) rotate(-6)">
      <rect width="150" height="96" rx="9" fill="#0D2740" stroke="#28517A" stroke-width="2"/>
      <path d="M40 62 L58 30 L76 62 Z" fill="none" stroke="#F4B400" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="56.5" y="41" width="3" height="12" rx="1.5" fill="#F4B400"/>
      <circle cx="58" cy="57" r="2" fill="#F4B400"/>
      <g fill="#456F99">
        <rect x="92" y="40" width="42" height="7" rx="3.5"/>
        <rect x="92" y="56" width="30" height="7" rx="3.5"/>
      </g>
    </g>

    <!-- rastros de desconexão -->
    <g stroke="#2E5B85" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 11" fill="none" opacity=".85">
      <path d="M286 176c48 26 84 6 132 20"/>
      <path d="M300 312c56-6 92 14 150 2"/>
      <path d="M232 214c-14 34 6 58 22 78"/>
    </g>
  </g>

  <!-- ============ FAIXA DE TRANSFORMAÇÃO ============ -->
  <g transform="translate(0 398)">
    <rect x="80" y="0" width="640" height="1.5" fill="url(#amberFade)"/>
    <g transform="translate(400 0)">
      <circle r="30" fill="#0B1F33" stroke="#F4B400" stroke-width="2.5"/>
      <path d="M0 -12v24M-10 4l10 10 10-10" fill="none" stroke="#F4B400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ============ ZONA INFERIOR — sistema conectado ============ -->
  <g transform="translate(0 46)">
    <!-- conectores -->
    <g stroke="#F4B400" stroke-width="2.5" fill="none" opacity=".7">
      <path d="M400 474v34"/>
      <path d="M400 508H216v30M400 508h184v30M400 508v30"/>
    </g>

    <!-- nó principal -->
    <g transform="translate(268 402)">
      <rect width="264" height="72" rx="14" fill="#0B1F33" stroke="#F4B400" stroke-width="2.5"/>
      <rect x="22" y="22" width="28" height="28" rx="7" fill="#F4B400"/>
      <path d="M30 36l6 6 12-12" fill="none" stroke="#0B1F33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#C7D6E6">
        <rect x="68" y="26" width="120" height="9" rx="4.5"/>
        <rect x="68" y="45" width="78" height="8" rx="4" opacity=".6"/>
      </g>
    </g>

    <!-- três nós alinhados -->
    <g>
      <g transform="translate(128 538)">
        <rect width="176" height="130" rx="12" fill="#0E2A46" stroke="#2E6491" stroke-width="2"/>
        <rect x="20" y="20" width="26" height="26" rx="7" fill="#F4B400" opacity=".22"/>
        <path d="M27 33l5 5 10-10" fill="none" stroke="#F4B400" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#8FA9C2">
          <rect x="20" y="62" width="120" height="8" rx="4"/>
          <rect x="20" y="82" width="96" height="8" rx="4" opacity=".7"/>
          <rect x="20" y="102" width="70" height="8" rx="4" opacity=".45"/>
        </g>
      </g>
      <g transform="translate(312 538)">
        <rect width="176" height="130" rx="12" fill="#0E2A46" stroke="#2E6491" stroke-width="2"/>
        <rect x="20" y="20" width="26" height="26" rx="7" fill="#F4B400" opacity=".22"/>
        <path d="M27 33l5 5 10-10" fill="none" stroke="#F4B400" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#8FA9C2">
          <rect x="20" y="62" width="132" height="8" rx="4"/>
          <rect x="20" y="82" width="88" height="8" rx="4" opacity=".7"/>
          <rect x="20" y="102" width="108" height="8" rx="4" opacity=".45"/>
        </g>
      </g>
      <g transform="translate(496 538)">
        <rect width="176" height="130" rx="12" fill="#0E2A46" stroke="#2E6491" stroke-width="2"/>
        <rect x="20" y="20" width="26" height="26" rx="7" fill="#F4B400" opacity=".22"/>
        <path d="M27 33l5 5 10-10" fill="none" stroke="#F4B400" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#8FA9C2">
          <rect x="20" y="62" width="104" height="8" rx="4"/>
          <rect x="20" y="82" width="126" height="8" rx="4" opacity=".7"/>
          <rect x="20" y="102" width="62" height="8" rx="4" opacity=".45"/>
        </g>
      </g>
    </g>
  </g>
</svg>
